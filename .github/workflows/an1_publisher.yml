name: AN1 Blog Publisher & Sync

on:
  schedule:
    # Runs every 4 hours at minute 25, avoiding hour 0 (midnight UTC) and minute 0 to avoid GitHub Actions peak load delays
    - cron: "25 2,6,10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      post_url:
        description: "Specific AN1 post URL to scrape and publish (e.g. https://an1.com/4683-subway-surfers-mod-apk-8.html)"
        required: false
        default: ""
      limit:
        description: "Max new posts to publish if no URL is provided"
        required: false
        default: "10"
      publish_mode:
        description: "Publish as live or draft"
        required: false
        default: "live"
        type: choice
        options:
          - live
          - draft
      source_url:
        description: "AN1 tag or category page to crawl (defaults to https://an1.com/tags/mods/)"
        required: false
        default: ""


concurrency:
  group: an1-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load publication ledger and prose cache from ledger branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin ledger > /dev/null 2>&1; then
            echo "Fetching ledger from origin/ledger..."
            git fetch origin ledger:refs/remotes/origin/ledger
            git checkout origin/ledger -- data/an1_published.json 2>/dev/null || echo "data/an1_published.json not found on ledger branch yet; using repository state."
            # The prose cache holds reviews generated for posts that have not published
            # yet. history.db is gitignored and rebuilt each run, so without restoring this
            # file every deferred post is regenerated against the Gemini daily quota.
            git checkout origin/ledger -- data/an1_prose_cache.json 2>/dev/null || echo "data/an1_prose_cache.json not found on ledger branch yet; starting with an empty cache."
          else
            echo "Ledger branch not found on origin; using repository state."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Blogger secrets
        run: |
          missing=()
          [ -z "${{ secrets.BLOGGER_BLOG_ID }}" ] && missing+=("BLOGGER_BLOG_ID")
          [ -z "${{ secrets.BLOGGER_CLIENT_ID }}" ] && missing+=("BLOGGER_CLIENT_ID")
          [ -z "${{ secrets.BLOGGER_CLIENT_SECRET }}" ] && missing+=("BLOGGER_CLIENT_SECRET")
          [ -z "${{ secrets.BLOGGER_REFRESH_TOKEN }}" ] && missing+=("BLOGGER_REFRESH_TOKEN")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required Blogger secrets: ${missing[*]}"
            exit 1
          fi

      - name: Run AN1 scraping and publishing pipeline
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE_FLAG="--live"
          if [ "${{ github.event.inputs.publish_mode }}" = "draft" ]; then
            MODE_FLAG="--draft"
          fi

          if [ -n "${{ github.event.inputs.post_url }}" ]; then
            echo "Publishing specific AN1 post: ${{ github.event.inputs.post_url }}"
            python -m src.main an1-post "${{ github.event.inputs.post_url }}" $MODE_FLAG
          else
            LIMIT="${{ github.event.inputs.limit || '10' }}"
            SOURCE_FLAG=""
            if [ -n "${{ github.event.inputs.source_url }}" ]; then
              SOURCE_FLAG="--source ${{ github.event.inputs.source_url }}"
            fi
            echo "Syncing new posts from AN1.com (limit: $LIMIT)..."
            python -m src.main an1-sync --limit "$LIMIT" $MODE_FLAG $SOURCE_FLAG
          fi

      - name: Commit and push publication ledger to ledger branch
        # always(): if the pipeline publishes some posts and then fails, the ledger still
        # has to be persisted or those posts get republished on the next run. The same
        # applies to the prose cache - losing it means paying Gemini twice for the posts
        # that were generated but not published.
        if: always()
        run: |
          if [ -f data/an1_published.json ] || [ -f data/an1_prose_cache.json ]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"

            # Stash updated state temporarily
            [ -f data/an1_published.json ] && cp data/an1_published.json /tmp/an1_published.json
            [ -f data/an1_prose_cache.json ] && cp data/an1_prose_cache.json /tmp/an1_prose_cache.json

            # Switch to ledger branch. The fetch is allowed to fail: on the very first
            # run the branch does not exist yet, and the checkout below falls back to
            # creating it. Without the guard, bash -e aborts the step and the first run's
            # ledger is never persisted.
            git fetch origin ledger || true
            git checkout -B ledger origin/ledger || git checkout -B ledger

            # Restore updated files on ledger branch
            mkdir -p data
            if [ -f /tmp/an1_published.json ]; then
              cp /tmp/an1_published.json data/an1_published.json
              git add data/an1_published.json
            fi
            if [ -f /tmp/an1_prose_cache.json ]; then
              cp /tmp/an1_prose_cache.json data/an1_prose_cache.json
              git add data/an1_prose_cache.json
            fi

            if ! git diff --staged --quiet; then
              git commit -m "Update AN1 published posts ledger [skip ci]"
              git pull --rebase --autostash origin ledger 2>/dev/null || true
              git push origin ledger
              echo "Successfully pushed updated ledger to ledger branch."
            else
              echo "No new publications to commit."
            fi
          fi

